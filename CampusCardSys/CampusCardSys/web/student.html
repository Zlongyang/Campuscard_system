<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生中心 - 校园卡管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-layout">
    <!-- ===== 侧边栏 ===== -->
    <nav class="sidebar">
        <div class="logo">🎓 校园卡</div>
        <button class="nav-item active" data-page="overview">🏠 我的校园卡</button>
        <button class="nav-item" data-page="records">📋 交易记录</button>
        <button class="nav-item" data-page="consume">🍽️ 消费模拟</button>
        <button class="nav-item" data-page="password">🔒 修改密码</button>
    </nav>

    <!-- ===== 主内容区 ===== -->
    <div class="main-content">
        <div class="topbar">
            <h2 id="pageTitle">🏠 我的校园卡</h2>
            <div class="user-info">
                <span>🎓 <span id="studentName">同学</span></span>
                <button class="btn-logout" onclick="doLogout()">退出登录</button>
            </div>
        </div>

        <!-- 我的校园卡 -->
        <div id="page-overview" style="display:block;">
            <div id="cardInfo"></div>
            <div class="card" style="margin-top:24px;">
                <div class="card-header"><h3>个人信息</h3></div>
                <div class="card-body" id="personalInfo"></div>
            </div>
        </div>

        <!-- 交易记录 -->
        <div id="page-records" style="display:none;">
            <div class="card">
                <div class="card-header"><h3>我的交易记录</h3></div>
                <div class="card-body">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>ID</th><th>类型</th><th>金额</th><th>操作前余额</th><th>操作后余额</th><th>时间</th><th>描述</th></tr>
                            </thead>
                            <tbody id="myRecordsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消费模拟 -->
        <div id="page-consume" style="display:none;">
            <div class="card">
                <div class="card-header"><h3>模拟消费（食堂/超市刷卡）</h3></div>
                <div class="card-body">
                    <div style="max-width:480px;">
                        <div class="form-group">
                            <label>卡 号</label>
                            <input type="text" id="consumeCardNo" placeholder="请输入校园卡号">
                        </div>
                        <div class="form-group">
                            <label>消费金额</label>
                            <input type="number" id="consumeAmount" placeholder="请输入金额" step="0.01" min="0.01">
                        </div>
                        <div class="form-group">
                            <label>消费地点/描述</label>
                            <input type="text" id="consumeDesc" placeholder="如: 一食堂二楼">
                        </div>
                        <button class="btn btn-primary" onclick="doConsume()">确认消费</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 修改密码 -->
        <div id="page-password" style="display:none;">
            <div class="card">
                <div class="card-header"><h3>修改密码</h3></div>
                <div class="card-body">
                    <div style="max-width:400px;">
                        <div class="form-group">
                            <label>旧密码</label>
                            <input type="password" id="oldPassword" placeholder="请输入旧密码">
                        </div>
                        <div class="form-group">
                            <label>新密码</label>
                            <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）">
                        </div>
                        <div class="form-group">
                            <label>确认新密码</label>
                            <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                        </div>
                        <button class="btn btn-primary" onclick="doChangePassword()">修改密码</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
if (!requireRole(1)) { /* 已跳转 */ }

/* ========== 导航切换 ========== */
document.querySelectorAll('.sidebar .nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
        document.querySelectorAll('.sidebar .nav-item').forEach(function(i) { i.classList.remove('active'); });
        this.classList.add('active');

        var page = this.dataset.page;
        document.getElementById('pageTitle').textContent = this.textContent.trim();
        document.querySelectorAll('[id^="page-"]').forEach(function(p) { p.style.display = 'none'; });
        document.getElementById('page-' + page).style.display = 'block';

        if (page === 'overview') loadMyCard();
        else if (page === 'records') loadMyRecords();
    });
});

/* ========== 加载我的校园卡 ========== */
async function loadMyCard() {
    /* 获取卡信息 */
    var cardResult = await apiGetMyCard();
    var cardDiv = document.getElementById('cardInfo');

    if (cardResult.code !== 200 || !cardResult.data) {
        cardDiv.innerHTML = '<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">💳</div>您还没有校园卡，请联系管理员办理</div></div></div>';
    } else {
        var c = cardResult.data;
        cardDiv.innerHTML = '<div class="stats-grid">' +
            '<div class="stat-card primary"><div class="stat-label">卡号</div><div class="stat-value" style="font-size:18px;">' + c.card_no + '</div></div>' +
            '<div class="stat-card success"><div class="stat-label">当前余额</div><div class="stat-value">' + formatMoney(c.balance) + '</div></div>' +
            '<div class="stat-card info"><div class="stat-label">卡状态</div><div class="stat-value" style="font-size:22px;">' + c.status_str + '</div></div>' +
            '<div class="stat-card"><div class="stat-label">每日限额</div><div class="stat-value">' + formatMoney(c.daily_limit) + '</div></div>' +
            '</div>';
    }

    /* 获取个人信息 */
    var infoResult = await apiGetMyInfo();
    var infoDiv = document.getElementById('personalInfo');
    if (infoResult.code === 200 && infoResult.data) {
        var s = infoResult.data;
        document.getElementById('studentName').textContent = s.name;
        infoDiv.innerHTML = '<table><tr><th>学号</th><td>' + s.student_no + '</td><th>姓名</th><td>' + s.name + '</td></tr>' +
                           '<tr><th>院系</th><td>' + s.department + '</td><th>年级</th><td>' + (s.grade || '--') + '</td></tr>' +
                           '<tr><th>手机</th><td>' + (s.phone || '--') + '</td><th></th><td></td></tr></table>';
    }
}

/* ========== 交易记录 ========== */
async function loadMyRecords() {
    var result = await apiGetMyRecords();
    var tbody = document.getElementById('myRecordsTable');
    if (!result.data || !result.data.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">📋</div>暂无交易记录</div></td></tr>';
        return;
    }
    tbody.innerHTML = result.data.map(function(r) {
        return '<tr><td>' + r.id + '</td><td>' + recordTypeBadge(r.type) + '</td><td>' + formatMoney(r.amount) + '</td><td>' + formatMoney(r.balance_before) + '</td><td>' + formatMoney(r.balance_after) + '</td><td>' + formatTime(r.time) + '</td><td>' + (r.description || '--') + '</td></tr>';
    }).join('');
}

/* ========== 消费 ========== */
async function doConsume() {
    var cardNo = document.getElementById('consumeCardNo').value.trim();
    var amount = parseFloat(document.getElementById('consumeAmount').value);
    var desc = document.getElementById('consumeDesc').value.trim();

    if (!cardNo || !amount || amount <= 0) {
        showToast('请填写卡号和有效金额', 'error');
        return;
    }

    var result = await apiCardConsume(cardNo, amount, desc);
    if (result.code === 200) {
        showToast('消费成功！扣除 ' + formatMoney(amount) + '，余额: ' + formatMoney(result.data.balance), 'success');
        document.getElementById('consumeAmount').value = '';
        document.getElementById('consumeDesc').value = '';
    } else {
        showToast(result.msg, 'error');
    }
}

/* ========== 修改密码 ========== */
async function doChangePassword() {
    var oldPwd = document.getElementById('oldPassword').value;
    var newPwd = document.getElementById('newPassword').value;
    var confirmPwd = document.getElementById('confirmPassword').value;

    if (!oldPwd || !newPwd || !confirmPwd) {
        showToast('请填写所有密码字段', 'error');
        return;
    }
    if (newPwd.length < 6) {
        showToast('新密码至少6位', 'error');
        return;
    }
    if (newPwd !== confirmPwd) {
        showToast('两次输入的新密码不一致', 'error');
        return;
    }

    var result = await apiChangePassword(oldPwd, newPwd);
    if (result.code === 200) {
        showToast('密码修改成功！', 'success');
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    } else {
        showToast(result.msg, 'error');
    }
}

/* ========== 退出 ========== */
async function doLogout() {
    await apiLogout();
    window.location.href = 'login.html';
}

/* ========== 初始加载 ========== */
loadMyCard();
</script>
</body>
</html>
