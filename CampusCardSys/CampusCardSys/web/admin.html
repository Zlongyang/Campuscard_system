<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 校园卡管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-layout">
    <!-- ===== 侧边栏 ===== -->
    <nav class="sidebar">
        <div class="logo">🎓 校园卡管理</div>
        <button class="nav-item active" data-page="dashboard">📊 系统概览</button>
        <button class="nav-item" data-page="students">👥 学生管理</button>
        <button class="nav-item" data-page="cards">💳 校园卡管理</button>
        <button class="nav-item" data-page="records">📋 交易记录</button>
        <button class="nav-item" data-page="recharge">💰 卡片充值</button>
    </nav>

    <!-- ===== 主内容区 ===== -->
    <div class="main-content">
        <div class="topbar">
            <h2 id="pageTitle">📊 系统概览</h2>
            <div class="user-info">
                <span>👨‍💼 <span id="accountName">admin</span></span>
                <button class="btn-logout" onclick="doLogout()">退出登录</button>
            </div>
        </div>

        <!-- 仪表盘 -->
        <div id="page-dashboard" style="display:block;">
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <!-- 学生管理 -->
        <div id="page-students" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <h3>学生列表</h3>
                    <button class="btn btn-primary btn-sm" onclick="openStudentModal()">+ 添加学生</button>
                </div>
                <div class="card-body">
                    <div class="search-bar">
                        <input type="text" id="studentSearch" placeholder="搜索学号/姓名/院系...">
                        <button class="btn btn-primary" onclick="loadStudents()">搜索</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>ID</th><th>学号</th><th>姓名</th><th>院系</th><th>年级</th><th>手机</th><th>操作</th></tr>
                            </thead>
                            <tbody id="studentTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 校园卡管理 -->
        <div id="page-cards" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <h3>校园卡列表</h3>
                    <button class="btn btn-primary btn-sm" onclick="openIssueCardModal()">+ 办理新卡</button>
                </div>
                <div class="card-body">
                    <div class="search-bar">
                        <input type="text" id="cardSearch" placeholder="搜索卡号/学号/姓名...">
                        <button class="btn btn-primary" onclick="loadCards()">搜索</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>卡号</th><th>学号</th><th>姓名</th><th>余额</th><th>状态</th><th>日限额</th><th>发卡日期</th><th>操作</th></tr>
                            </thead>
                            <tbody id="cardTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 交易记录 -->
        <div id="page-records" style="display:none;">
            <div class="card">
                <div class="card-header"><h3>交易记录</h3></div>
                <div class="card-body">
                    <div class="search-bar">
                        <input type="text" id="recordSearch" placeholder="搜索卡号或描述...">
                        <button class="btn btn-primary" onclick="loadRecords()">搜索</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>ID</th><th>卡号</th><th>学号</th><th>类型</th><th>金额</th><th>操作前余额</th><th>操作后余额</th><th>时间</th><th>描述</th></tr>
                            </thead>
                            <tbody id="recordTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 充值 -->
        <div id="page-recharge" style="display:none;">
            <div class="card">
                <div class="card-header"><h3>卡片充值</h3></div>
                <div class="card-body">
                    <div style="max-width:480px;">
                        <div class="form-group">
                            <label>卡 号</label>
                            <input type="text" id="rechargeCardNo" placeholder="请输入校园卡号">
                        </div>
                        <div class="form-group">
                            <label>充值金额</label>
                            <input type="number" id="rechargeAmount" placeholder="请输入金额" step="0.01" min="0.01">
                        </div>
                        <div class="form-group">
                            <label>备 注</label>
                            <input type="text" id="rechargeDesc" placeholder="充值备注 (可选)">
                        </div>
                        <button class="btn btn-primary" onclick="doRecharge()">确认充值</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== 弹窗：添加/编辑学生 ===== -->
<div class="modal-overlay" id="studentModal">
    <div class="modal">
        <h3 id="studentModalTitle">添加学生</h3>
        <form id="studentForm">
            <input type="hidden" id="editStudentNo">
            <div class="form-group"><label>姓名 *</label><input type="text" id="stuName" required></div>
            <div class="form-group"><label>院系 *</label><input type="text" id="stuDept" required></div>
            <div class="form-group"><label>年级</label><input type="text" id="stuGrade" placeholder="如: 2024级"></div>
            <div class="form-group"><label>手机号</label><input type="text" id="stuPhone" placeholder="11位手机号"></div>
            <div class="form-group"><label>密码</label><input type="password" id="stuPassword" placeholder="留空则使用默认密码 123456"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeStudentModal()">取消</button>
                <button type="submit" class="btn btn-primary">保 存</button>
            </div>
        </form>
    </div>
</div>

<!-- ===== 弹窗：办卡 ===== -->
<div class="modal-overlay" id="issueCardModal">
    <div class="modal">
        <h3>办理新卡</h3>
        <form id="issueCardForm">
            <div class="form-group"><label>学号 *</label><input type="text" id="issueStudentNo" required></div>
            <div class="form-group"><label>每日消费限额</label><input type="number" id="issueDailyLimit" value="500" step="1" min="1"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeIssueCardModal()">取消</button>
                <button type="submit" class="btn btn-primary">确认办卡</button>
            </div>
        </form>
    </div>
</div>

<script src="api.js"></script>
<script>
if (!requireRole(0)) { /* 已跳转 */ }

var accountName = localStorage.getItem('account') || 'admin';
document.getElementById('accountName').textContent = accountName;

/* ========== 导航切换 ========== */
document.querySelectorAll('.sidebar .nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
        /* 高亮 */
        document.querySelectorAll('.sidebar .nav-item').forEach(function(i) { i.classList.remove('active'); });
        this.classList.add('active');

        /* 切换页面 */
        var page = this.dataset.page;
        document.getElementById('pageTitle').textContent = this.textContent.trim();
        document.querySelectorAll('[id^="page-"]').forEach(function(p) { p.style.display = 'none'; });
        document.getElementById('page-' + page).style.display = 'block';

        /* 加载数据 */
        if (page === 'dashboard') loadStats();
        else if (page === 'students') loadStudents();
        else if (page === 'cards') loadCards();
        else if (page === 'records') loadRecords();
    });
});

/* ========== 统计概览 ========== */
async function loadStats() {
    var result = await apiGetStats();
    if (result.code !== 200) return;

    var s = result.data;
    var grid = document.getElementById('statsGrid');
    grid.innerHTML =
        '<div class="stat-card primary"><div class="stat-label">学生总数</div><div class="stat-value">' + s.total_students + '</div></div>' +
        '<div class="stat-card info"><div class="stat-label">校园卡总数</div><div class="stat-value">' + s.total_cards + '</div></div>' +
        '<div class="stat-card success"><div class="stat-label">正常卡 / 总余额</div><div class="stat-value" style="font-size:22px;">' + s.active_cards + ' 张 / ' + formatMoney(s.total_balance) + '</div></div>' +
        '<div class="stat-card warning"><div class="stat-label">今日消费</div><div class="stat-value">' + s.today_consumes + ' 笔 / ' + formatMoney(s.today_consume_amount) + '</div></div>' +
        '<div class="stat-card info"><div class="stat-label">今日充值</div><div class="stat-value">' + s.today_recharges + ' 笔 / ' + formatMoney(s.today_recharge_amount) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">冻结 / 挂失 / 注销</div><div class="stat-value" style="font-size:20px;">' + s.frozen_cards + ' / ' + s.lost_cards + ' / ' + s.cancelled_cards + '</div></div>';
}

/* ========== 学生管理 ========== */
async function loadStudents() {
    var keyword = document.getElementById('studentSearch').value.trim();
    var result = await apiGetStudents(keyword);
    var tbody = document.getElementById('studentTable');
    if (!result.data || !result.data.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">📭</div>暂无学生数据</div></td></tr>';
        return;
    }
    tbody.innerHTML = result.data.map(function(s) {
        return '<tr><td>' + s.id + '</td><td>' + s.student_no + '</td><td>' + s.name + '</td><td>' + s.department + '</td><td>' + (s.grade || '--') + '</td><td>' + (s.phone || '--') + '</td>' +
               '<td><div class="btn-group">' +
               '<button class="btn btn-outline btn-sm" onclick="editStudent(\'' + s.student_no + '\',\'' + s.name + '\',\'' + s.department + '\',\'' + (s.grade||'') + '\',\'' + (s.phone||'') + '\')">编辑</button>' +
               '<button class="btn btn-danger btn-sm" onclick="deleteStudent(\'' + s.student_no + '\')">删除</button>' +
               '</div></td></tr>';
    }).join('');
}

function openStudentModal() {
    document.getElementById('studentModalTitle').textContent = '添加学生';
    document.getElementById('editStudentNo').value = '';
    document.getElementById('stuName').value = '';
    document.getElementById('stuDept').value = '';
    document.getElementById('stuGrade').value = '';
    document.getElementById('stuPhone').value = '';
    document.getElementById('stuPassword').value = '';
    document.getElementById('studentModal').classList.add('show');
}

function closeStudentModal() {
    document.getElementById('studentModal').classList.remove('show');
}

function editStudent(no, name, dept, grade, phone) {
    document.getElementById('studentModalTitle').textContent = '编辑学生';
    document.getElementById('editStudentNo').value = no;
    document.getElementById('stuName').value = name;
    document.getElementById('stuDept').value = dept;
    document.getElementById('stuGrade').value = grade;
    document.getElementById('stuPhone').value = phone;
    document.getElementById('stuPassword').value = '';
    document.getElementById('studentModal').classList.add('show');
}

document.getElementById('studentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var editNo = document.getElementById('editStudentNo').value;
    var data = {
        name: document.getElementById('stuName').value.trim(),
        department: document.getElementById('stuDept').value.trim(),
        grade: document.getElementById('stuGrade').value.trim(),
        phone: document.getElementById('stuPhone').value.trim(),
        password: document.getElementById('stuPassword').value.trim()
    };

    var result;
    if (editNo) {
        data.student_no = editNo;
        result = await apiEditStudent(data);
    } else {
        result = await apiAddStudent(data);
    }

    if (result.code === 200) {
        showToast(result.msg, 'success');
        closeStudentModal();
        loadStudents();
    } else {
        showToast(result.msg, 'error');
    }
});

async function deleteStudent(no) {
    if (!confirm('确定要删除学生 ' + no + ' 吗？')) return;
    var result = await apiDeleteStudent(no);
    if (result.code === 200) {
        showToast(result.msg, 'success');
        loadStudents();
    } else {
        showToast(result.msg, 'error');
    }
}

/* ========== 校园卡管理 ========== */
async function loadCards() {
    var keyword = document.getElementById('cardSearch').value.trim();
    var result = await apiGetCards(keyword);
    var tbody = document.getElementById('cardTable');
    if (!result.data || !result.data.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon">💳</div>暂无校园卡数据</div></td></tr>';
        return;
    }
    tbody.innerHTML = result.data.map(function(c) {
        var actions = '<div class="btn-group">';
        if (c.status === 0) {
            actions += '<button class="btn btn-warning btn-sm" onclick="freezeCard(\'' + c.card_no + '\')">冻结</button>';
            actions += '<button class="btn btn-danger btn-sm" onclick="reportLostCard(\'' + c.card_no + '\')">挂失</button>';
        } else if (c.status === 1) {
            actions += '<button class="btn btn-success btn-sm" onclick="unfreezeCard(\'' + c.card_no + '\')">解冻</button>';
        }
        if (c.status !== 3) {
            actions += '<button class="btn btn-danger btn-sm" onclick="cancelCard(\'' + c.card_no + '\')">注销</button>';
        }
        actions += '</div>';
        return '<tr><td>' + c.card_no + '</td><td>' + c.student_no + '</td><td>' + c.name + '</td><td>' + formatMoney(c.balance) + '</td><td>' + statusBadge(c.status) + '</td><td>' + formatMoney(c.daily_limit) + '</td><td>' + (c.issue_date || '--') + '</td><td>' + actions + '</td></tr>';
    }).join('');
}

function openIssueCardModal() {
    document.getElementById('issueStudentNo').value = '';
    document.getElementById('issueDailyLimit').value = '500';
    document.getElementById('issueCardModal').classList.add('show');
}

function closeIssueCardModal() {
    document.getElementById('issueCardModal').classList.remove('show');
}

document.getElementById('issueCardForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var result = await apiIssueCard(
        document.getElementById('issueStudentNo').value.trim(),
        parseFloat(document.getElementById('issueDailyLimit').value)
    );
    if (result.code === 200) {
        showToast(result.msg, 'success');
        closeIssueCardModal();
        loadCards();
    } else {
        showToast(result.msg, 'error');
    }
});

async function freezeCard(no) {
    if (!confirm('确定冻结卡 ' + no + ' 吗？')) return;
    var result = await apiCardFreeze(no);
    showToast(result.msg, result.code === 200 ? 'success' : 'error');
    loadCards();
}

async function unfreezeCard(no) {
    if (!confirm('确定解冻卡 ' + no + ' 吗？')) return;
    var result = await apiCardUnfreeze(no);
    showToast(result.msg, result.code === 200 ? 'success' : 'error');
    loadCards();
}

async function reportLostCard(no) {
    if (!confirm('确定挂失卡 ' + no + ' 吗？')) return;
    var result = await apiCardReportLost(no);
    showToast(result.msg, result.code === 200 ? 'success' : 'error');
    loadCards();
}

async function cancelCard(no) {
    if (!confirm('确定注销卡 ' + no + ' 吗？此操作不可恢复！')) return;
    var result = await apiCardCancel(no);
    showToast(result.msg, result.code === 200 ? 'success' : 'error');
    loadCards();
}

/* ========== 交易记录 ========== */
async function loadRecords() {
    var keyword = document.getElementById('recordSearch').value.trim();
    var result = await apiGetRecords(keyword ? { keyword: keyword } : null);
    var tbody = document.getElementById('recordTable');
    if (!result.data || !result.data.length) {
        tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="icon">📋</div>暂无交易记录</div></td></tr>';
        return;
    }
    tbody.innerHTML = result.data.map(function(r) {
        return '<tr><td>' + r.id + '</td><td>' + r.card_no + '</td><td>' + r.student_no + '</td><td>' + recordTypeBadge(r.type) + '</td><td>' + formatMoney(r.amount) + '</td><td>' + formatMoney(r.balance_before) + '</td><td>' + formatMoney(r.balance_after) + '</td><td>' + formatTime(r.time) + '</td><td>' + (r.description || '--') + '</td></tr>';
    }).join('');
}

/* ========== 充值 ========== */
async function doRecharge() {
    var cardNo = document.getElementById('rechargeCardNo').value.trim();
    var amount = parseFloat(document.getElementById('rechargeAmount').value);
    var desc = document.getElementById('rechargeDesc').value.trim();

    if (!cardNo || !amount || amount <= 0) {
        showToast('请填写卡号和有效金额', 'error');
        return;
    }

    var result = await apiCardRecharge(cardNo, amount, desc);
    if (result.code === 200) {
        showToast('充值成功！当前余额: ' + formatMoney(result.data.card.balance), 'success');
        document.getElementById('rechargeCardNo').value = '';
        document.getElementById('rechargeAmount').value = '';
        document.getElementById('rechargeDesc').value = '';
    } else {
        showToast(result.msg, 'error');
    }
}

/* ========== 退出 ========== */
async function doLogout() {
    await apiLogout();
    window.location.href = 'login.html';
}

/* ========== 搜索回车事件 ========== */
document.getElementById('studentSearch').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadStudents(); });
document.getElementById('cardSearch').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadCards(); });
document.getElementById('recordSearch').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadRecords(); });

/* ========== 关闭弹窗 ========== */
document.getElementById('studentModal').addEventListener('click', function(e) {
    if (e.target === this) closeStudentModal();
});
document.getElementById('issueCardModal').addEventListener('click', function(e) {
    if (e.target === this) closeIssueCardModal();
});

/* ========== 初始加载 ========== */
loadStats();
</script>
</body>
</html>
